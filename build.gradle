plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1' // 최신 안정화 버전
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pingpong.jlab'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. Web & RestClient (3.2+ 부터는 starter-web에 RestClient 포함)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 2. Security & OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	testImplementation 'org.springframework.security:spring-security-test'

	// 3. JWT (최신 버전 0.12.x는 API가 많이 변경되었으므로 0.11.5 유지 혹은 업데이트)
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// 4. DB Settings (MySQL Connector 명칭 변경 및 MyBatis)
	runtimeOnly 'com.mysql:mysql-connector-j' // mysql-connector-java에서 변경됨
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3' // 3.x용
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

	// 5. JPA & QueryDSL (Spring Boot 3버전 설정)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta' // jakarta 필수
	annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// 6. Tools
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// 7. S3 Settings (Spring Cloud AWS 3.x 버전으로 업데이트)
	implementation 'io.awspring.cloud:spring-cloud-starter-aws:2.4.4' // 3.x 호환 버전 확인 필요

	// 8. Swagger (SpringDoc OpenAPI 2.x로 업데이트 필수)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// 9. AI API
	implementation 'com.google.genai:google-genai:1.3.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// QueryDSL 빌드 옵션 (Spring Boot 3에서는 훨씬 간결해집니다)
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
	options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
	delete querydslDir
}